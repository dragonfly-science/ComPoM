# Creates a GitHub release when a version tag (vX.Y.Z) is pushed. The tag must match the
# version in DESCRIPTION. The release notes are the matching section of NEWS.md.
on:
  push:
    tags: ['v*']

name: release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against DESCRIPTION
        run: |
          ver=$(grep '^Version:' DESCRIPTION | sed 's/Version: *//')
          if [ "v${ver}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match DESCRIPTION version v${ver}"
            exit 1
          fi
          # NEWS section for this version
          awk -v v="# ComPoM ${ver}" '$0==v{f=1;next} /^# ComPoM /{f=0} f' NEWS.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::NEWS.md has no section '# ComPoM ${ver}'"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md

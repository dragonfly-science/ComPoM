# Builds the pkgdown site (reference, NEWS and the vignettes as articles) and deploys it to
# GitHub Pages from main (builds on dev and pull requests are not deployed). Pages must be enabled for the gh-pages branch (repository settings).
# The articles fit models, so a build takes about 15-20 minutes.
on:
  push:
    branches: [main, dev]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::., any::rstan, any::BH, any::RcppEigen
          needs: website

      - name: Check pkgdown configuration
        run: pkgdown::check_pkgdown()
        shell: Rscript {0}

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub Pages
        # deploy from main and on releases; builds on dev and pull requests only test the site
        if: github.ref == 'refs/heads/main' || github.event_name == 'release'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

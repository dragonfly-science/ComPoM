# R CMD check on push/PR. Vignettes are not built here: the simulation and data
# vignettes need local data files and extra packages (tidyverse, here, terra,
# fmesher, cmdstanr) and take long to run. The test suite compiles small brms
# models with rstan, so a run takes several minutes.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # BH, RcppEigen: compile-time headers rstan needs to build the brms
          # models fitted in tests/testthat/helper-sim.R
          extra-packages: any::rcmdcheck, any::rstan, any::BH, any::RcppEigen
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--ignore-vignettes")'
          build_args: 'c("--no-build-vignettes")'
          # Fail on errors only for now; the package still raises NOTEs/WARNINGs
          # (e.g. undeclared global variables from tidy evaluation).
          error-on: '"error"'
          upload-snapshots: true
